name: Build Windows Agent

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build:
    name: Build & Test Windows Agent
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore apps/windows-agent/PrintBridgeAgent.sln

      - name: Run Windows Agent Tests
        run: dotnet test apps/windows-agent/PrintBridgeAgent.Tests/PrintBridgeAgent.Tests.csproj --no-restore --verbosity normal

      - name: Publish self-contained Windows x64 executable
        run: |
          dotnet publish apps/windows-agent/PrintBridgeAgent/PrintBridgeAgent.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -o apps/windows-agent/dist

      - name: Upload Windows Agent artifact
        uses: actions/upload-artifact@v4
        with:
          name: PrintBridgeAgent-win-x64
          path: apps/windows-agent/dist/PrintBridgeAgent.exe

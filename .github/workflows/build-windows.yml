
name: Build PrintBridge Windows Agent

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Test Windows Agent
        run: dotnet test apps/windows-agent/PrintBridgeAgent.Tests/PrintBridgeAgent.Tests.csproj -c Release

      - name: Publish Windows x64 EXE
        run: dotnet publish apps/windows-agent/PrintBridgeAgent/PrintBridgeAgent.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish/windows-x64

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: PrintBridge-Windows-x64
          path: publish/windows-x64/
          retention-days: 7
